name: publish image

# Build the bot image and push it to GitHub Container Registry (GHCR) so the
# server can `docker pull ghcr.io/landsspacesss/anytype-ai:latest` instead of
# building locally.
#
# Builds only when a version TAG is pushed (v1.2.3) — NOT on every push to main.
# (Manual "Run workflow" is also available as an escape hatch.) This keeps GHCR
# for actual releases; day-to-day deploys use the local `./deploy.sh`.
#
# The repo is public, so the published package is public too — pulling needs no
# `docker login`. Auth here uses the built-in GITHUB_TOKEN (no extra secrets).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
